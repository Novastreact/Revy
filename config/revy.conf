# Revy Configuration File - User Space Version  
# Location: ~/.revy/config/revy.conf
# Multi-permission support enabled with default chmod 444

[save]
# Source directory to backup (supports $USER, $HOME variables)
source=$HOME/Downloads
# Destination for backups (user-writable location)
destination=/media/sf_External/debian_zennx
# Excluded patterns (comma-separated, supports glob patterns)
excluded=node_modules,package-lock.json,.git,__pycache__,dist,build,.cache,*.tmp,*.log,.DS_Store,Thumbs.db

[recovery]
# Root directory where snapshots are stored
snapshot_root=/media/sf_External/ubuntu_zennx
# Default target for recovery operations
default_target=$HOME/Downloads
# IMPORTANT: Auto-install dependencies after recovery (npm, pip, etc.)
recovery_auto_install=true
# Show preview of files that will be deleted/replaced
show_destructive_preview=true

[permissions]
# Multi-permission support - all commands will be executed in order
# Default chmod 444 (read-only for all files) - applied if no other chmod commands specified
# post_recovery_chmod=find . -type f -exec chmod 444 {} +
# Script files executable
post_recovery_chmod=find . -type f -name "*.sh" -exec chmod 755 {} +
# JavaScript files readable
post_recovery_chmod=find . -type f -name "*.js" -exec chmod 644 {} +
# JSON files readable
post_recovery_chmod=find . -type f -name "*.json" -exec chmod 644 {} +
# Python files readable
post_recovery_chmod=find . -type f -name "*.py" -exec chmod 644 {} +
# All other files default to 444 (read-only)
post_recovery_chmod=find . -type f ! -name "*.sh" ! -name "*.js" ! -name "*.json" ! -name "*.py" -exec chmod 764 {} +
# Directories accessible
post_recovery_chmod=find . -type d -exec chmod 755 {} +
# Ownership (will skip if not root - safe to include)
post_recovery_chown=chown -R $USER:$USER .
# Enable permission restoration
restore_permissions=true

[meta]
# History file location
history_file=$HOME/.local/share/revy/history.json
# Maximum history entries to keep
max_history_entries=100
# Enable file checksums (slower but more reliable)
enable_checksums=false
# Version information
version=2.54.0

[ui]
# Progress bar style
progress_style=bar
# Spinner animation style
spinner_style=dots
# Enable colored output
color_output=true
# Single key navigation in menus
single_key_navigation=true

[advanced]
# Use atomic operations (safer)
atomic_operations=true
# Temporary file suffix
temp_suffix=_revy_tmp_
# Number of parallel copy workers
parallel_copy_workers=4
# Verify files after copying
verify_after_copy=true
# Minimum free space required (percentage)
min_free_space_percent=10
